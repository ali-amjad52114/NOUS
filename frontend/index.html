<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Nous — Personal brain</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #edf4f2;
      --card: #ffffff;
      --line: #dbe8e4;
      --ink: #16342f;
      --body: #42605a;
      --mut: #7b938d;
      --faint: #a9bcb7;
      --sage: #5ea99d;
      --sage-soft: #9ccac1;
      --sage-bg: #dcedea;
      --deep: #17433c;
      --amber: #b7791f;
      --amber-bg: #fdf3df;
      --amber-line: #ecd9ae;
      --red: #b54a40;
      --red-bg: #fdecea;
      --red-line: #f0c9c4;
      --purple: #6d55c8;
      --purple-bg: #f1edfd;
      --purple-line: #d9d0f5;
      --green: #2e7d5b;
      --green-bg: #e7f5ee;
      --green-line: #c4e5d4;
      --ink-raised: var(--card);
      --surface: var(--sage-bg);
      --surface-strong: #fbfdfc;
      --line-bright: var(--line);
      --paper: var(--ink);
      --muted: var(--mut);
      --muted-2: var(--faint);
      --amber-soft: var(--amber-bg);
      --red-soft: var(--red-bg);
      --green-soft: var(--green-bg);
      --blue: var(--sage);
      --violet: var(--purple);
      --cyan: var(--sage);
      --radius: 24px;
      --ui-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      --mono-font: "SFMono-Regular", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 75% -20%, rgba(94, 169, 157, 0.14), transparent 34rem),
        radial-gradient(circle at 4% 0%, rgba(94, 169, 157, 0.1), transparent 28rem),
        var(--bg);
      color: var(--paper);
      font-family: var(--ui-font);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    button,
    a {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    .app-header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(237, 244, 242, 0.9);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      font-size: 29px;
      font-weight: 690;
      letter-spacing: -0.04em;
    }

    .brand-mark {
      width: 33px;
      height: 33px;
      flex: 0 0 auto;
      filter: drop-shadow(0 5px 8px rgba(23, 67, 60, 0.12));
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 560;
    }

    .connection-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--sage);
      box-shadow: 0 0 0 4px rgba(94, 169, 157, 0.12);
    }

    .connection[data-state="online"] {
      color: var(--green);
    }

    .connection[data-state="online"] .connection-dot {
      background: var(--sage);
      box-shadow: 0 0 0 4px rgba(94, 169, 157, 0.12), 0 4px 12px rgba(94, 169, 157, 0.2);
    }

    .connection[data-state="offline"] {
      color: var(--red);
    }

    .connection[data-state="offline"] .connection-dot {
      background: var(--red);
      box-shadow: 0 0 0 4px rgba(181, 74, 64, 0.1);
    }

    .app-shell {
      display: grid;
      grid-template-columns: minmax(290px, 0.86fr) minmax(500px, 1.52fr) minmax(310px, 0.94fr);
      gap: 8px;
      height: calc(100vh - 64px);
      padding: 0 8px 8px;
    }

    .panel {
      min-width: 0;
      min-height: 0;
      background:
        var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(23, 67, 60, 0.06);
    }

    .panel-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 25px 24px 20px;
    }

    .panel-title {
      margin: 0;
      color: var(--paper);
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1.2px;
      line-height: 1.04;
    }

    .panel-count {
      color: var(--mut);
      font-family: var(--mono-font);
      font-size: 12px;
    }

    .story-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .event-list {
      display: grid;
      align-content: start;
      gap: 9px;
      min-height: 0;
      overflow-y: auto;
      padding: 0 17px 14px;
      position: relative;
      scrollbar-color: var(--line-bright) transparent;
      scrollbar-width: thin;
    }

    .event-list::before {
      content: "";
      position: absolute;
      z-index: 0;
      top: 34px;
      bottom: 44px;
      left: 49px;
      width: 2px;
      border-radius: 99px;
      background: var(--line-bright);
      box-shadow: none;
      opacity: 0.82;
    }

    .event-card {
      position: relative;
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      gap: 13px;
      padding: 14px 15px 14px 13px;
      min-height: 105px;
      z-index: 1;
      background: #fbfdfc;
      border: 1px solid var(--line);
      border-radius: 15px;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .event-card[data-state="next"] {
      background: var(--sage-bg);
      border-color: var(--sage);
      box-shadow: inset 3px 0 0 var(--sage), 0 10px 30px rgba(23, 67, 60, 0.06);
    }

    .event-card[data-state="sent"] {
      opacity: 0.76;
      border-color: var(--line);
    }

    .event-card[data-state="sent"] .event-step::after {
      background: var(--faint);
    }

    .event-card[data-state="next"] .event-step::after {
      background: var(--sage);
      box-shadow: 0 0 0 4px rgba(94, 169, 157, 0.15);
    }

    .event-step {
      position: relative;
      display: flex;
      justify-content: center;
      padding-top: 2px;
      border-right: 1px solid var(--line);
      color: var(--muted);
      font-family: var(--mono-font);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .event-step::after {
      content: "";
      position: absolute;
      top: 29px;
      right: -4px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--faint);
    }

    .event-main {
      min-width: 0;
    }

    .event-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .event-person {
      overflow: hidden;
      color: var(--body);
      font-size: 14px;
      font-weight: 610;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .event-channel {
      flex: 0 0 auto;
      font-family: var(--mono-font);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .event-subject {
      display: -webkit-box;
      overflow: hidden;
      margin: 0;
      color: var(--paper);
      font-size: 15px;
      font-weight: 530;
      line-height: 1.25;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .event-id {
      margin-top: 8px;
      color: var(--faint);
      font-family: var(--mono-font);
      font-size: 10px;
    }

    .story-footer {
      padding: 12px 17px 17px;
      background: linear-gradient(180deg, transparent, var(--card) 20%);
    }

    .primary-button,
    .semantic-action,
    .watch-action,
    .approve-button {
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      transition: filter 150ms ease, transform 150ms ease, background 150ms ease, border-color 150ms ease;
    }

    .primary-button:hover,
    .semantic-action:hover,
    .approve-button:hover {
      filter: brightness(1.035);
      transform: translateY(-1px);
    }

    .primary-button:active,
    .semantic-action:active,
    .watch-action:active,
    .approve-button:active {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: not-allowed;
      filter: grayscale(0.6);
      opacity: 0.46;
    }

    .primary-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 66px;
      padding: 12px 24px;
      background: var(--sage-soft);
      color: var(--deep);
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0;
      box-shadow: 0 10px 30px rgba(23, 67, 60, 0.06);
    }

    .button-arrow {
      width: 23px;
      height: 23px;
      stroke-width: 1.8;
    }

    .feed-panel {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
    }

    .goal-composer {
      position: relative;
      display: grid;
      grid-template-columns: minmax(150px, 0.66fr) minmax(280px, 1.34fr);
      align-items: center;
      gap: 16px;
      margin: 0 20px 15px;
      padding: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 34px;
      background: var(--card);
      box-shadow: 0 30px 70px rgba(23, 67, 60, 0.13);
    }

    .goal-composer::before {
      content: "";
      position: absolute;
      top: 0;
      right: 14px;
      left: 14px;
      height: 1px;
      background: var(--sage);
      opacity: 0.5;
    }

    .goal-copy {
      min-width: 0;
    }

    .goal-label {
      display: block;
      margin-bottom: 4px;
      color: var(--paper);
      font-size: 17px;
      font-weight: 690;
      letter-spacing: -0.025em;
    }

    .goal-hint {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .goal-entry {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      min-width: 0;
    }

    .goal-input {
      min-width: 0;
      min-height: 49px;
      padding: 0 14px;
      border: 2px solid var(--line);
      border-radius: 16px;
      outline: none;
      background: #f4faf8;
      color: var(--paper);
      font-family: var(--ui-font);
      font-size: 17px;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .goal-input::placeholder {
      color: var(--faint);
    }

    .goal-input:focus {
      border-color: var(--sage);
      box-shadow: 0 0 0 5px rgba(94, 169, 157, 0.13);
    }

    .goal-submit {
      min-height: 49px;
      padding: 12px 24px;
      border: 0;
      border-radius: 999px;
      background: var(--sage-soft);
      color: var(--deep);
      cursor: pointer;
      font-size: 14.5px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 10px 30px rgba(23, 67, 60, 0.06);
      transition: filter 150ms ease, transform 150ms ease;
    }

    .goal-submit:hover {
      filter: brightness(1.035);
      transform: translateY(-1px);
    }

    .goal-submit:active {
      transform: translateY(1px);
    }

    .feed-status {
      color: var(--muted);
      font-family: var(--mono-font);
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .feed-status::after {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-left: 9px;
      border-radius: 50%;
      background: var(--sage);
      box-shadow: 0 0 0 4px rgba(94, 169, 157, 0.12);
      vertical-align: 1px;
    }

    .feed-list {
      min-height: 0;
      overflow-y: auto;
      padding: 0 20px 18px;
      scroll-behavior: smooth;
      scrollbar-color: var(--line-bright) transparent;
      scrollbar-width: thin;
    }

    .feed-line {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 11px;
      padding: 7px 4px;
      color: var(--body);
      font-family: var(--mono-font);
      font-size: 11.6px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      animation: feed-in 0.4s cubic-bezier(0.2, 0.9, 0.3, 1) both;
    }

    .feed-index {
      color: var(--faint);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .feed-card {
      position: relative;
      margin: 9px 0;
      padding: 22px 20px;
      border: 1px solid currentColor;
      border-radius: 24px;
      overflow: hidden;
      animation: feed-in 0.4s cubic-bezier(0.2, 0.9, 0.3, 1) both;
    }

    .feed-card::before {
      display: none;
    }

    .feed-card[data-tone="promise"] {
      color: var(--amber);
      background: var(--amber-bg);
      border-color: var(--amber-line);
      box-shadow: none;
    }

    .feed-card[data-tone="plan"] {
      color: var(--purple);
      background: var(--purple-bg);
      border-color: var(--purple-line);
    }

    .feed-card[data-tone="slot"] {
      color: var(--green);
      background: var(--green-bg);
      border-color: var(--green-line);
    }

    .feed-card[data-tone="refusing"] {
      color: var(--red);
      background: var(--red-bg);
      border-color: var(--red-line);
    }

    .feed-card[data-tone="done"] {
      color: var(--green);
      background: var(--green-bg);
      border-color: var(--green-line);
    }

    .feed-card-content {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .feed-card-copy {
      min-width: 0;
    }

    .feed-card-label {
      margin: 0 0 7px;
      font-size: 10.5px;
      font-weight: 850;
      letter-spacing: 1.8px;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .feed-card-line {
      margin: 0;
      color: var(--body);
      font-family: var(--mono-font);
      font-size: 13px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .semantic-action {
      flex: 0 0 auto;
      min-width: 105px;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 13px;
      background: linear-gradient(160deg, #e8a33d, #cf8a1f);
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(183, 121, 31, 0.25);
    }

    .watch-tray {
      margin: 0 14px 14px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--card);
      box-shadow: 0 10px 30px rgba(23, 67, 60, 0.06);
    }

    .watch-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .watch-title {
      margin: 0;
      font-size: 16px;
      font-weight: 620;
      letter-spacing: -0.02em;
    }

    .watch-pulse {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--sage);
      font-family: var(--mono-font);
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .watch-pulse::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .watch-actions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
    }

    .watch-action {
      min-height: 53px;
      padding: 8px 10px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--paper);
      font-size: 14.5px;
      font-weight: 700;
    }

    .watch-action:hover {
      background: var(--surface-strong);
      border-color: var(--sage);
      transform: translateY(-1px);
    }

    .watch-action[data-kind="done"] {
      border-color: transparent;
      background: var(--deep);
      color: #eaf5f2;
    }

    .score-panel {
      display: grid;
      grid-template-rows: auto auto 1px minmax(0, 1fr) auto;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      align-items: stretch;
      min-height: 188px;
      padding: 8px 20px 24px;
    }

    .score-divider {
      background: var(--line-bright);
    }

    .score {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      padding: 0 8px;
    }

    .score-label {
      margin-bottom: 2px;
      color: var(--mut);
      font-family: var(--mono-font);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.8px;
    }

    .score-value {
      color: var(--body);
      background: none;
      -webkit-text-fill-color: currentColor;
      font-size: clamp(70px, 7.2vw, 112px);
      font-weight: 410;
      letter-spacing: -0.09em;
      line-height: 0.94;
      font-variant-numeric: tabular-nums;
    }

    .score:last-child .score-value {
      color: var(--sage);
    }

    .section-rule {
      margin: 0 17px;
      background: var(--line);
    }

    .graph-section {
      min-height: 0;
      overflow-y: auto;
      padding: 24px 21px 12px;
      scrollbar-color: var(--line-bright) transparent;
      scrollbar-width: thin;
    }

    .graph-title {
      margin: 0 0 20px;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1.2px;
    }

    .graph-lines {
      display: grid;
      gap: 9px;
      color: var(--body);
      font-family: var(--mono-font);
      font-size: 11.6px;
      line-height: 1.55;
    }

    .graph-line {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .graph-raw {
      min-width: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .chip {
      flex: 0 0 auto;
      margin-top: -1px;
      padding: 3px 7px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 9.5px;
      font-weight: 850;
      letter-spacing: 0.08em;
    }

    .chip[data-tone="armed"] {
      color: var(--green);
      background: var(--green-bg);
      border-color: var(--green-line);
    }

    .chip[data-tone="pending"] {
      color: var(--amber);
      background: var(--amber-bg);
      border-color: var(--amber-line);
    }

    .score-footer {
      padding: 12px 17px 19px;
      background: linear-gradient(180deg, transparent, var(--card) 18%);
    }

    .approve-button {
      width: 100%;
      min-height: 62px;
      margin-bottom: 14px;
      border-radius: 11px;
      background: var(--deep);
      color: #eaf5f2;
      font-size: 14.5px;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(23, 67, 60, 0.09);
    }

    .graph-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 46px;
      border-radius: 999px;
      background: var(--deep);
      color: #eaf5f2;
      font-size: 14.5px;
      font-weight: 700;
      text-decoration: none;
    }

    .graph-link:hover {
      color: #ffffff;
      text-decoration: none;
      transform: translateY(-1px);
    }

    .graph-link svg {
      width: 15px;
      height: 15px;
    }

    .toast {
      position: fixed;
      z-index: 20;
      right: 22px;
      bottom: 22px;
      max-width: min(390px, calc(100vw - 44px));
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--card);
      color: var(--paper);
      font-size: 13px;
      line-height: 1.4;
      box-shadow: 0 10px 30px rgba(23, 67, 60, 0.1);
      opacity: 0;
      pointer-events: none;
      transform: translateY(9px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast[data-open="true"] {
      opacity: 1;
      transform: translateY(0);
    }

    .toast[data-tone="error"] {
      border-color: var(--red-line);
      color: var(--red);
    }

    @keyframes feed-in {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 1160px) {
      body {
        overflow: auto;
      }

      .app-shell {
        grid-template-columns: minmax(280px, 0.85fr) minmax(480px, 1.4fr);
        height: auto;
        min-height: calc(100vh - 64px);
      }

      .story-panel,
      .feed-panel {
        height: calc(100vh - 72px);
      }

      .score-panel {
        grid-column: 1 / -1;
        min-height: 670px;
      }

      .score-value {
        font-size: clamp(92px, 15vw, 160px);
      }

      .watch-actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .goal-composer {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 780px) {
      .app-header {
        height: 61px;
        padding: 0 17px;
      }

      .brand {
        font-size: 25px;
      }

      .brand-mark {
        width: 29px;
        height: 29px;
      }

      .connection span:last-child {
        display: none;
      }

      .app-shell {
        display: block;
        min-height: calc(100vh - 61px);
        padding: 4px;
      }

      .panel {
        margin-bottom: 4px;
      }

      .story-panel,
      .feed-panel {
        height: auto;
        min-height: 610px;
      }

      .story-panel {
        grid-template-rows: auto auto auto;
      }

      .event-list {
        max-height: 520px;
      }

      .feed-list {
        min-height: 500px;
        max-height: 70vh;
      }

      .goal-composer {
        margin-right: 13px;
        margin-left: 13px;
      }

      .panel-header {
        padding: 21px 19px 17px;
      }

      .panel-title {
        font-size: 31px;
      }

      .watch-actions {
        grid-template-columns: 1fr 1fr;
      }

      .score-panel {
        min-height: 650px;
      }
    }

    @media (max-width: 460px) {
      .goal-entry {
        grid-template-columns: 1fr;
      }

      .goal-submit {
        width: 100%;
      }

      .event-card {
        min-height: 98px;
      }

      .feed-list {
        padding-right: 13px;
        padding-left: 13px;
      }

      .feed-card-content {
        align-items: flex-start;
        flex-direction: column;
      }

      .semantic-action {
        width: 100%;
      }

      .scoreboard {
        min-height: 155px;
        padding-right: 10px;
        padding-left: 10px;
      }

      .score-value {
        font-size: 68px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand" aria-label="Nous">
      <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true">
        <defs>
          <linearGradient id="nous-mark-gradient" x1="4" y1="5" x2="31" y2="31" gradientUnits="userSpaceOnUse">
            <stop stop-color="#5ea99d"></stop>
            <stop offset="1" stop-color="#5ea99d"></stop>
          </linearGradient>
        </defs>
        <g fill="none" stroke="url(#nous-mark-gradient)" stroke-width="2">
          <ellipse cx="14.5" cy="18" rx="11" ry="7.2" transform="rotate(-31 14.5 18)"></ellipse>
          <ellipse cx="21.5" cy="18" rx="11" ry="7.2" transform="rotate(31 21.5 18)"></ellipse>
          <ellipse cx="18" cy="22" rx="10.5" ry="7" transform="rotate(4 18 22)"></ellipse>
        </g>
      </svg>
      <span>Nous</span>
    </div>
    <div class="connection" id="connection" data-state="connecting" role="status" aria-live="polite">
      <span class="connection-dot" aria-hidden="true"></span>
      <span id="connection-label">Connecting</span>
      <span>· Brain service</span>
    </div>
  </header>

  <main class="app-shell">
    <section class="panel story-panel" aria-labelledby="story-title">
      <div class="panel-header">
        <h1 class="panel-title" id="story-title">Story</h1>
        <span class="panel-count" id="story-count">01 / 06</span>
      </div>
      <div class="event-list" id="event-list"></div>
      <div class="story-footer">
        <button class="primary-button" id="next-event" type="button">
          <span>Next event</span>
          <svg class="button-arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 12h15M14 6l6 6-6 6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
      </div>
    </section>

    <section class="panel feed-panel" aria-labelledby="feed-title">
      <div class="panel-header">
        <h2 class="panel-title" id="feed-title">Live feed</h2>
        <span class="feed-status">Polling · 1 sec</span>
      </div>
      <form class="goal-composer" id="goal-form">
        <div class="goal-copy">
          <label class="goal-label" for="goal-input">What do you want to do?</label>
          <p class="goal-hint">Nous works out the steps and protects the best available time.</p>
        </div>
        <div class="goal-entry">
          <input class="goal-input" id="goal-input" name="goal" type="text" maxlength="160"
                 autocomplete="off" placeholder="Visit Sam before chemo starts" required>
          <button class="goal-submit" id="goal-submit" type="submit">Find the best time</button>
        </div>
      </form>
      <div class="feed-list" id="feed-list" aria-live="polite" aria-relevant="additions text"></div>
      <div class="watch-tray" id="watch-tray" hidden>
        <div class="watch-header">
          <h3 class="watch-title" id="watch-title">Watching</h3>
          <span class="watch-pulse">Learning</span>
        </div>
        <div class="watch-actions" id="watch-actions"></div>
      </div>
    </section>

    <aside class="panel score-panel" aria-labelledby="score-title">
      <div class="panel-header">
        <h2 class="panel-title" id="score-title">Scoreboard</h2>
      </div>
      <div class="scoreboard" aria-label="You versus brain action totals">
        <div class="score">
          <span class="score-label">YOU</span>
          <span class="score-value" id="you-score">00</span>
        </div>
        <span class="score-divider" aria-hidden="true"></span>
        <div class="score">
          <span class="score-label">BRAIN</span>
          <span class="score-value" id="brain-score">00</span>
        </div>
      </div>
      <div class="section-rule" aria-hidden="true"></div>
      <section class="graph-section" aria-labelledby="graph-title">
        <h3 class="graph-title" id="graph-title">Protocol graph</h3>
        <div class="graph-lines" id="graph-lines"></div>
      </section>
      <div class="score-footer">
        <button class="approve-button" id="approve-protocol" type="button">Approve P-001</button>
        <a class="graph-link" href="http://localhost:3000" target="_blank" rel="noreferrer">
          <span>Open graph explorer</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 5h10v10M19 5 7 17M5 9v10h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </a>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script id="story-data" type="application/json">[
    {"id":"evt-1","type":"message_in","channel":"gmail","from":"sam.k@gmail.com","person":"Sam","subject":"moving to London","body":"Hey man — it's official, I'm moving to London. Flight's on the 18th. Feels like we barely got to hang out this year."},
    {"id":"evt-2","type":"message_out","channel":"gmail","to":"sam.k@gmail.com","person":"Sam","subject":"re: moving to London","body":"No way! I'm coming to see you before you go, I promise. Not missing this one."},
    {"id":"evt-3","type":"message_in","channel":"gmail","from":"billing@acmedesign.co","person":"Acme Design","subject":"Invoice #4417 — due Aug 17","body":"Please find attached invoice for $850.","attachment":"invoice_4417.pdf"},
    {"id":"evt-4","type":"message_in","channel":"slack","from":"newsletter@technews.io","person":"TechNews","subject":"Your Monday briefing","body":"Top stories in AI this week..."},
    {"id":"evt-5","type":"message_in","channel":"gmail","from":"invoices@cloudhost.com","person":"CloudHost","subject":"CloudHost invoice CH-2231 for July","body":"Amount due: $120. Invoice attached.","attachment":"CH-2231.pdf"},
    {"id":"evt-6","type":"message_in","channel":"gmail","from":"accounts@metroutilities.com","person":"Metro Utilities","subject":"Metro Utilities — invoice 88213","body":"Your monthly invoice of $96 is attached.","attachment":"88213.pdf"}
  ]</script>
  <script id="action-contracts" type="application/json">{
    "watchActions":[
      {"label":"Forward","body":{"action":"forward","params":{"to":"accounting@myfirm.com"}}},
      {"label":"Label invoices","body":{"action":"label","params":{"name":"invoices"}}},
      {"label":"Archive","body":{"action":"archive","params":{}}}
    ],
    "watchDone":{},
    "approveProtocol":{"protocol_id":"P-001"},
    "approveCommitment":{"commitment_id":"C-001"}
  }</script>
  <script>
    (function () {
      "use strict";

      var API_BASE = "http://127.0.0.1:7200";
      var story = JSON.parse(document.getElementById("story-data").textContent);
      var contracts = JSON.parse(document.getElementById("action-contracts").textContent);
      var storyIndex = Math.min(
        Math.max(Number(sessionStorage.getItem("nousStoryIndex") || 0), 0),
        story.length
      );
      var dashboardState = {
        log: [],
        scoreboard: "",
        graph: "",
        pending_queue: [],
        watching: null
      };
      var logSignature = "";
      var pollInFlight = false;
      var toastTimer = 0;

      var eventList = document.getElementById("event-list");
      var storyCount = document.getElementById("story-count");
      var nextEventButton = document.getElementById("next-event");
      var goalForm = document.getElementById("goal-form");
      var goalInput = document.getElementById("goal-input");
      var goalSubmit = document.getElementById("goal-submit");
      var feedList = document.getElementById("feed-list");
      var watchTray = document.getElementById("watch-tray");
      var watchTitle = document.getElementById("watch-title");
      var watchActions = document.getElementById("watch-actions");
      var graphLines = document.getElementById("graph-lines");
      var approveProtocolButton = document.getElementById("approve-protocol");
      var connection = document.getElementById("connection");
      var connectionLabel = document.getElementById("connection-label");
      var toast = document.getElementById("toast");

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function showToast(message, tone) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.dataset.tone = tone || "default";
        toast.dataset.open = "true";
        toastTimer = window.setTimeout(function () {
          toast.dataset.open = "false";
        }, 2600);
      }

      function setConnection(state) {
        connection.dataset.state = state;
        connectionLabel.textContent =
          state === "online" ? "Live" :
          state === "offline" ? "Offline" :
          "Connecting";
      }

      function renderStory() {
        var fragment = document.createDocumentFragment();

        story.forEach(function (event, index) {
          var card = document.createElement("article");
          var step = document.createElement("div");
          var main = document.createElement("div");
          var meta = document.createElement("div");
          var person = document.createElement("span");
          var channel = document.createElement("span");
          var subject = document.createElement("p");
          var id = document.createElement("div");

          card.className = "event-card";
          card.dataset.state = index < storyIndex ? "sent" : index === storyIndex ? "next" : "queued";

          step.className = "event-step";
          step.textContent = pad(index + 1);

          main.className = "event-main";
          meta.className = "event-meta";
          person.className = "event-person";
          person.textContent = event.person || event.from || event.to || "Unknown";
          channel.className = "event-channel";
          channel.textContent = event.channel;
          subject.className = "event-subject";
          subject.textContent = event.subject;
          id.className = "event-id";
          id.textContent = event.id + (index < storyIndex ? " · sent" : "");

          meta.append(person, channel);
          main.append(meta, subject, id);
          card.append(step, main);
          fragment.append(card);
        });

        eventList.replaceChildren(fragment);
        storyCount.textContent = storyIndex >= story.length
          ? pad(story.length) + " / " + pad(story.length)
          : pad(storyIndex + 1) + " / " + pad(story.length);
        nextEventButton.disabled = storyIndex >= story.length;
        nextEventButton.querySelector("span").textContent =
          storyIndex >= story.length ? "Story complete" : "Next event";
      }

      function semanticTone(line) {
        if (/PLAN READY/i.test(line)) return "plan";
        if (/BEST SLOT/i.test(line)) return "slot";
        if (/PROMISE DETECTED/i.test(line)) return "promise";
        if (/REFUSING/i.test(line)) return "refusing";
        if (/done autonomously/i.test(line)) return "done";
        return "";
      }

      function semanticLabel(tone) {
        if (tone === "plan") return "PLAN READY";
        if (tone === "slot") return "BEST SLOT";
        if (tone === "promise") return "PROMISE DETECTED";
        if (tone === "refusing") return "REFUSING";
        return "done autonomously";
      }

      function renderFeed(log) {
        var wasNearBottom = feedList.scrollHeight - feedList.scrollTop - feedList.clientHeight < 90;
        var fragment = document.createDocumentFragment();

        log.forEach(function (line, index) {
          var tone = semanticTone(line);

          if (tone) {
            var card = document.createElement("article");
            var content = document.createElement("div");
            var copy = document.createElement("div");
            var label = document.createElement("h3");
            var body = document.createElement("p");

            card.className = "feed-card";
            card.dataset.tone = tone;
            content.className = "feed-card-content";
            copy.className = "feed-card-copy";
            label.className = "feed-card-label";
            label.textContent = semanticLabel(tone);
            body.className = "feed-card-line";
            body.textContent = line;
            copy.append(label, body);
            content.append(copy);

            if (tone === "promise") {
              var bookButton = document.createElement("button");
              bookButton.type = "button";
              bookButton.className = "semantic-action";
              bookButton.textContent = "Book it";
              bookButton.addEventListener("click", function () {
                runMutation(
                  "/approve-commitment",
                  contracts.approveCommitment,
                  bookButton,
                  "Commitment C-001 booked"
                );
              });
              content.append(bookButton);
            }

            card.append(content);
            fragment.append(card);
            return;
          }

          var row = document.createElement("div");
          var count = document.createElement("span");
          var text = document.createElement("span");
          row.className = "feed-line";
          count.className = "feed-index";
          count.textContent = pad(index + 1);
          text.textContent = line;
          row.append(count, text);
          fragment.append(row);
        });

        feedList.replaceChildren(fragment);
        if (wasNearBottom || log.length <= 5) {
          var scrollToLatest = function () {
            feedList.scrollTop = feedList.scrollHeight;
          };
          window.requestAnimationFrame(scrollToLatest);
          window.setTimeout(scrollToLatest, 260);
        }
      }

      function parseScoreboard(scoreboard) {
        var you = scoreboard.match(/you:\s*(\d+)/i);
        var brain = scoreboard.match(/brain:\s*(\d+)/i);
        document.getElementById("you-score").textContent = pad(you ? you[1] : 0);
        document.getElementById("brain-score").textContent = pad(brain ? brain[1] : 0);
      }

      function renderGraph(graph) {
        var fragment = document.createDocumentFragment();

        String(graph || "").split("\n").filter(Boolean).forEach(function (line) {
          var row = document.createElement("div");
          var raw = document.createElement("span");
          var pending = /PENDING(?: APPROVAL)?/i.test(line);
          var armed = /\bARMED\b/i.test(line);
          var chip = null;

          row.className = "graph-line";
          raw.className = "graph-raw";
          raw.textContent = line.replace(/\s*\[(?:ARMED|PENDING APPROVAL)\]\s*/i, "");
          row.append(raw);

          if (armed || pending) {
            chip = document.createElement("span");
            chip.className = "chip";
            chip.dataset.tone = armed ? "armed" : "pending";
            chip.textContent = armed ? "ARMED" : "PENDING";
            row.append(chip);
          }

          fragment.append(row);
        });

        graphLines.replaceChildren(fragment);
      }

      function renderWatch(watching) {
        if (!watching) {
          watchTray.hidden = true;
          watchActions.replaceChildren();
          return;
        }

        watchTray.hidden = false;
        watchTitle.textContent = "Watching " + watching;
        var fragment = document.createDocumentFragment();

        contracts.watchActions.forEach(function (action) {
          var button = document.createElement("button");
          button.type = "button";
          button.className = "watch-action";
          button.textContent = action.label;
          button.addEventListener("click", function () {
            runMutation("/watch/action", action.body, button, action.label + " complete");
          });
          fragment.append(button);
        });

        var doneButton = document.createElement("button");
        doneButton.type = "button";
        doneButton.className = "watch-action";
        doneButton.dataset.kind = "done";
        doneButton.textContent = "Done";
        doneButton.addEventListener("click", function () {
          runMutation("/watch/done", contracts.watchDone, doneButton, "Protocol distilled");
        });
        fragment.append(doneButton);
        watchActions.replaceChildren(fragment);
      }

      function renderState(nextState) {
        dashboardState = nextState;
        var nextLogSignature = JSON.stringify(nextState.log || []);
        if (nextLogSignature !== logSignature) {
          logSignature = nextLogSignature;
          renderFeed(nextState.log || []);
        }
        parseScoreboard(nextState.scoreboard || "");
        renderGraph(nextState.graph || "");
        renderWatch(nextState.watching);
      }

      async function post(path, body) {
        var response = await fetch(API_BASE + path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        var payload = await response.json().catch(function () { return {}; });
        if (!response.ok) {
          throw new Error(payload.error || "Request failed");
        }
        return payload;
      }

      async function pollState() {
        if (pollInFlight) return;
        pollInFlight = true;
        try {
          var response = await fetch(API_BASE + "/state", { cache: "no-store" });
          if (!response.ok) throw new Error("State request failed");
          var state = await response.json();
          renderState(state);
          setConnection("online");
        } catch (error) {
          setConnection("offline");
        } finally {
          pollInFlight = false;
        }
      }

      async function runMutation(path, body, button, successMessage) {
        button.disabled = true;
        try {
          await post(path, body);
          showToast(successMessage);
          await pollState();
        } catch (error) {
          showToast(error.message, "error");
        } finally {
          button.disabled = false;
        }
      }

      goalForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        var goal = goalInput.value.trim();
        if (!goal) {
          showToast("Tell Nous what you want to do", "error");
          goalInput.focus();
          return;
        }

        goalSubmit.disabled = true;
        try {
          var result = await post("/goals", { goal: goal });
          goalInput.value = "";
          showToast("Best time: " + result.slot);
          await pollState();
        } catch (error) {
          showToast(error.message, "error");
        } finally {
          goalSubmit.disabled = false;
        }
      });

      nextEventButton.addEventListener("click", async function () {
        if (storyIndex >= story.length) return;
        nextEventButton.disabled = true;
        try {
          await post("/events", story[storyIndex]);
          storyIndex += 1;
          sessionStorage.setItem("nousStoryIndex", String(storyIndex));
          renderStory();
          await pollState();
        } catch (error) {
          showToast(error.message, "error");
          nextEventButton.disabled = false;
        }
      });

      approveProtocolButton.addEventListener("click", function () {
        runMutation(
          "/approve",
          contracts.approveProtocol,
          approveProtocolButton,
          "Protocol P-001 armed"
        );
      });

      renderStory();
      pollState();
      window.setInterval(pollState, 1000);
    }());
  </script>
</body>
</html>
